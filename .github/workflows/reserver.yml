name: Réservation BU

on:
  schedule:
    # 1er passage tôt : 5h05 UTC = 7h05 (été) / 6h05 (hiver), du lundi au vendredi
    - cron: "5 5 * * 1-5"
    # 2e passage de sécurité (si GitHub a raté le 1er ou si Affluences ouvre à 7h30) : 5h45 UTC = 7h45 (été) / 6h45 (hiver)
    - cron: "45 5 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date à tester (AAAA-MM-JJ). Vide = dans 14 jours"
        required: false

jobs:
  reserver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python reserver.py ${{ github.event.inputs.date }}
        env:
          AFF_EMAIL: ${{ secrets.AFF_EMAIL }}
          UGA_USER: ${{ secrets.UGA_USER }}
          UGA_PASS: ${{ secrets.UGA_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
