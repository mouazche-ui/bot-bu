name: Réservation BU

on:
  schedule:
    # 1. Ouverture Minuit Paris (Heure d'hiver UTC+1 : 23:00 / Heure d'été UTC+2 : 22:00)
    - cron: "0 23 * * *"
    - cron: "5 23 * * *"
    - cron: "0 22 * * *"
    - cron: "5 22 * * *"
    
    # 2. Ouverture 07h00 Paris (Heure d'hiver UTC+1 : 06:00 / Heure d'été UTC+2 : 05:00)
    - cron: "0 6 * * 1-5"
    - cron: "5 6 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "5 5 * * 1-5"

    # 3. Passages de sécurité en journée (15h00 et 17h00 Paris)
    - cron: "0 14 * * 1-5"
    - cron: "0 16 * * 1-5"

  workflow_dispatch:
    inputs:
      date:
        description: "Vide = J+14 | 'rattrapage' = tous les jours d'aujourd'hui à J+14 | ou AAAA-MM-JJ"
        required: false

jobs:
  reserver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: pip install requests playwright && python -m playwright install chromium
      - run: python reserver.py "${{ github.event.inputs.date }}"
        env:
          AFF_EMAIL: ${{ secrets.AFF_EMAIL }}
          UGA_USER: ${{ secrets.UGA_USER }}
          UGA_PASS: ${{ secrets.UGA_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
