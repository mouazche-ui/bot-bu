name: Réservation BU fiable

on:
  schedule:
    - cron: "7 0 * * *"
      timezone: Europe/Paris
    - cron: "7 7 * * 1-5"
      timezone: Europe/Paris
    

  workflow_dispatch:
    inputs:
      date:
        description: "Vide = J+14 ; rattrapage = J à J+14 ; ou AAAA-MM-JJ"
        required: false
        type: string
      mode:
        description: "diagnostic = tester ; execute = réserver et confirmer"
        type: choice
        default: diagnostic
        options:
          - diagnostic
          - execute

permissions:
  contents: read

concurrency:
  group: reservation-bu
  cancel-in-progress: false

jobs:
  reserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
      AFF_EMAIL: ${{ secrets.AFF_EMAIL }}
      UGA_USER: ${{ secrets.UGA_USER }}
      UGA_PASS: ${{ secrets.UGA_PASS }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      NB_PERSONNES: "3"
      DAYS_AHEAD: "14"
      START: "11:30"
      END: "20:30"
      MAIL_WAIT_SECONDS: "120"
      STATE_FILE: state/journal.json
      INPUT_DATE: ${{ inputs.date }}
      INPUT_MODE: ${{ inputs.mode }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Tests sans réseau
        run: python -m unittest discover -s tests -v

      - name: Restaurer le journal
        uses: actions/cache/restore@v4
        with:
          path: state
          key: bu-journal-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bu-journal-v1-

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Préparer et vérifier Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install chromium
          probe='from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
          if ! python -c "$probe"; then
            python -m playwright install --with-deps chromium
            python -c "$probe"
          fi

      - name: Réserver ou diagnostiquer
        shell: bash
        run: |
          set -euo pipefail
          args=("$INPUT_DATE")

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            args+=(--execute)
          elif [[ "$INPUT_MODE" == "execute" ]]; then
            args+=(--execute)
          else
            args+=(--diagnostic)
          fi

          python lancer_bu.py "${args[@]}"

      - name: Sauvegarder le journal
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'execute')
        uses: actions/cache/save@v4
        with:
          path: state
          key: bu-journal-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-bu-${{ github.run_id }}
          path: rapport.txt
          if-no-files-found: ignore
          retention-days: 7
