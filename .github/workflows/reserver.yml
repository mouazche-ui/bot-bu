name: Réservation BU

on:
  schedule:
    # Heure d'été (UTC+2) : 7h05 et 7h45 (heure de Paris)
    - cron: "5 5 * * 1-5"
    - cron: "45 5 * * 1-5"
    # Heure d'hiver (UTC+1) : 7h05 et 7h45 (heure de Paris)
    - cron: "5 6 * * 1-5"
    - cron: "45 6 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date à tester (AAAA-MM-JJ). Vide = dans 14 jours"
        required: false

jobs:
  reserver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python reserver.py ${{ github.event.inputs.date }}
        env:
          AFF_EMAIL: ${{ secrets.AFF_EMAIL }}
          UGA_USER: ${{ secrets.UGA_USER }}
          UGA_PASS: ${{ secrets.UGA_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
